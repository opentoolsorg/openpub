name: ci

on:
  pull_request:
    types:
    - labeled

jobs:
  test:
    if: "${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace openpub-dashboard
      - run: npm run build --workspace @openpub/site
      - run: npm test --workspace @openpub/site
      - run: npm run build --workspace @openpub/worker
      - name: Upload site release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-release
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: apps/site/.output/public/
      - name: Upload Worker release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-release
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: |
            apps/dashboard/.output/public/
            apps/worker/dist/
      - run: npm run cli:build
      - run: npm run mcp:build
      - name: CLI smoke test
        run: |
          node apps/cli/dist/index.js help
          node apps/cli/dist/index.js init
          node apps/cli/dist/index.js status
      - name: MCP handshake
        run: python3 test/mcp-handshake.py
    timeout-minutes: 30
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate' }}
