name = "openpub"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "assets_navigation_has_no_effect"]

[vars]
BASE_URL = "https://openpub.opentoolsorg.workers.dev"
DASHBOARD_URL = "https://openpub.opentoolsorg.workers.dev"

# SPA (TanStack Start, built to dashboard/.output/public) served as free static
# assets: navigation/asset requests never invoke the worker -> no bill.
# Worker runs first only for real API surface.
[assets]
directory = "../dashboard/.output/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/covers/*", "/health", "/dashboard"]

[[d1_databases]]
binding = "DB"
database_name = "openpub-db"
database_id = "5ea6b34a-26ce-4528-a572-d411d00f684e"
migrations_dir = "../../migrations"

[[kv_namespaces]]
binding = "KEYS"
id = "86d5f868566a4e589f70762badf565af"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "openpub-media"

[[queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "openpub-publish"

[[queues.consumers]]
queue = "openpub-publish"
max_batch_size = 5
max_retries = 3

[ai]
binding = "AI"
