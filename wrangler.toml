name = "openpub"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "assets_navigation_has_no_effect"]

[vars]
BASE_URL = "https://openpub.princslabs.workers.dev"
DASHBOARD_URL = "https://openpub.princslabs.workers.dev"

# SPA (TanStack Start, built to dashboard/.output/public) served as free static
# assets: navigation/asset requests never invoke the worker -> no bill.
# Worker runs first only for real API surface.
[assets]
directory = "./dashboard/.output/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/covers/*", "/health", "/dashboard"]

[[d1_databases]]
binding = "DB"
database_name = "openpub-db"
database_id = "a046242c-c914-44a9-87bc-0fe48a881a3c"

[[kv_namespaces]]
binding = "KEYS"
id = "78642abd78d640d6b9506dc8b12657bb"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "openpub-media"

[[queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "openpub-publish"

[[queues.consumers]]
queue = "openpub-publish"
max_batch_size = 5
max_retries = 3

[ai]
binding = "AI"
